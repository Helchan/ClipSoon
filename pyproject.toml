[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsoon"
version = "1.1.12"
description = "A fast, private, Spotlight-style clipboard history for macOS and Windows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "platformdirs>=4.2,<5",
  "pynput>=1.8.2,<2",
  "PySide6-Essentials>=6.10.1,<7",
  "pyobjc-framework-ApplicationServices>=11.1,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11.1,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "pytest>=8.4.2,<9",
  "pytest-qt>=4.5,<5",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.15,<1",
]
package = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
clipsoon = "clipsoon.launcher:main"

[tool.setuptools.packages.find]
include = ["clipsoon*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["clipsoon"]
omit = [
  "clipsoon/ui.py",
  "clipsoon/app.py",
  "clipsoon/__main__.py",
  "clipsoon/windows_clipboard_host.py",
  "clipsoon/windows_focus_host.py",
  "clipsoon/windows_hotkey_host.py",
  "clipsoon/windows_paste_host.py",
  "clipsoon/windows_workers.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
