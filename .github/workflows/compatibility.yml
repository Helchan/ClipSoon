name: Python compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / CPython ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up CPython ${{ matrix.python-version }} x64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint source
        shell: pwsh
        run: python -m ruff check .

      - name: Test source offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -vv --durations=20 --timeout=90 --timeout-method=thread

  macos-arm64:
    name: macOS 15 arm64 / CPython ${{ matrix.python-version }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up CPython ${{ matrix.python-version }} arm64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Verify Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install development dependencies
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint source
        shell: bash
        run: python -m ruff check .

      - name: Test source offscreen
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -vv --durations=20 --timeout=90 --timeout-method=thread
